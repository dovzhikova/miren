name: Checks
on:
  pull_request:
  push:
    branches: [master]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # deepmerge is only reached through shadcn. The published fix downgrades
      # shadcn to 1.0.0, so low-severity findings stay visible but do not fail CI.
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: /tmp/glowcheck-e2e-results
